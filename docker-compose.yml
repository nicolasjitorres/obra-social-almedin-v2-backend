version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: almedin-db
    environment:
      POSTGRES_DB: almedin_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - almedin_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: almedin-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/almedin_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      QUARKUS_PROFILE: prod
    ports:
      - "8080:8080"

volumes:
  almedin_data: