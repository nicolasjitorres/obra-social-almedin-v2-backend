# PEFIL DEV
# Configuracion de la BD --> postgresql
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/almedin_db}
%dev.quarkus.datasource.username=${DB_USER:postgres}
%dev.quarkus.datasource.password=${DB_PASSWORD:postgres}

# Generacion de las tablas
%dev.quarkus.hibernate-orm.schema-management.strategy=update
%dev.quarkus.hibernate-orm.log.sql=true

# Configuracion de REST y JSON
quarkus.jackson.write-dates-as-timestamps=false

# Configuracion de OpenAPI y SwaggerUI
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.path=/openapi
mp.openapi.extensions.smallrye.info.title=Almedin Obra Social API
mp.openapi.extensions.smallrye.info.version=1.0.0

# MapStruct
quarkus.mapstruct.injection-strategy=constructor

# Mailer
quarkus.mailer.mock=true
quarkus.mailer.from=noreply@almedin.com

# JWT
mp.jwt.verify.publickey.location=keys/public.pem
mp.jwt.verify.issuer=almedin-backend
smallrye.jwt.sign.key.location=keys/private.pem

# SCHEDULER
# Cuántas horas antes del turno enviar el recordatorio
almedin.reminder.hours-before=24
# Cada cuánto corre el scheduler (cron: todos los días a las 8am)
almedin.reminder.cron=0 0 8 * * ?

# ---------------------------------------------------------------------------------------------

# PERFIL TEST
# Levantar PostgreSQL real via Testcontainers
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:16

# Recrear las tablas limpias en cada run de tests
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Mailer: usar el mock para no enviar emails reales durante el desarrollo y testing
%test.quarkus.mailer.mock=true

# Deshabilitar el scheduler en tests para evitar interferencias
%test.quarkus.scheduler.enabled=false

# ---------------------------------------------------------------------------------------------

# PERFIL PROD
%prod.quarkus.mailer.host=${MAIL_HOST}
%prod.quarkus.mailer.port=${MAIL_PORT}
%prod.quarkus.mailer.start-tls=REQUIRED
%prod.quarkus.mailer.username=${MAIL_USERNAME}
%prod.quarkus.mailer.password=${MAIL_PASSWORD}
%prod.quarkus.mailer.from=${MAIL_FROM}
%prod.quarkus.mailer.mock=false
%prod.quarkus.hibernate-orm.schema-management.strategy=update
%prod.quarkus.hibernate-orm.log.sql=false